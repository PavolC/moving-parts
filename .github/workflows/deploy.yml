# Publish site/ to GitHub Pages.
#
# No application build or bundler: the index is one static file, and machinery
# around a page that changes when a course ships would be machinery for its own
# sake. The social card is regenerated with tools/make_og_image.sh before the
# site is uploaded, so the published PNG cannot drift from its HTML source.
# GitHub's runner provides the Chromium that script needs.
#
# This is live, and the courses depend on it: every course has SERIES.homeUrl
# pointing at what this publishes, set once at the course's creation, so the
# URL cannot move without editing every one of them.
#
# Two things had to be true before it could run, and neither can be done from
# here because both need repository admin rights. They are recorded because the
# first run failed on them, and because a move or a fresh repository would need
# them again:
#
#   1. The repository is public, or the account has a plan that allows Pages on
#      a private repository. On a free account, Pages on a private repo is not
#      available and this workflow fails at the deploy step.
#   2. Settings > Pages > Source is set to "GitHub Actions".

name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deploy at a time, and let a newer push win rather than queueing behind a
# build whose output is already stale.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v5
            - name: Render and validate social card
              run: bash tools/make_og_image.sh
            - name: Validate palette and text contrast
              run: python3 tools/brand_palette.py --check
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site
            - id: deployment
              uses: actions/deploy-pages@v4
