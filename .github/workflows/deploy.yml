# Publish site/ to GitHub Pages.
#
# No build step: the index is one static file, and a bundler around a page that
# changes when a course ships would be machinery for its own sake.
#
# Two things have to be true before this can run, and neither can be done from
# here because both need repository admin rights:
#
#   1. The repository is public, or the account has a plan that allows Pages on
#      a private repository. On a free account, Pages on a private repo is not
#      available and this workflow will fail at the deploy step.
#   2. Settings > Pages > Source is set to "GitHub Actions".
#
# The courses link up to whatever this publishes, so until it is live their
# SERIES.homeUrl stays null and their wordmark is plain text rather than a link
# to a 404.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push win rather than queueing behind a
# build whose output is already stale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
