<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  /* The series social card, 1200x630, screenshotted to site/og-image.png by
     tools/make_og_image.sh.

     A rendered page rather than a drawn image, for the same reason the rest of
     the identity is tokens: the card is then made of the family, the mark and
     the type roles, so a change to those reaches it. tools/check_brand.py
     asserts that the three hues of the mark here still match the page's.

     DejaVu leads both stacks because this renders in a headless Chromium on
     Linux, which has no Georgia. The card is the one surface whose type is
     resolved at author time rather than on the reader's machine.

     Every colour here is a literal, including the greys, because nothing in
     the page's stylesheet reaches a file rendered at author time. The nine
     hues and the mark are the ones check_brand.py compares; the rest are the
     page's own inks spelled out.

     No counts anywhere on it. A card that said "one course" would be a second
     hand-maintained list, in a PNG, where nothing can see it go stale. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body { background:#fdfdfb; color:#1a1a1a; font-family:"DejaVu Serif",Georgia,serif; position:relative; }

  /* The whole family across the top, as on the page: the family IS the series
     identity, and unlike a single hue it does not borrow any one course's
     colour. Nine flex children so it grows a segment when the family does. */
  .rule { position:absolute; top:0; left:0; right:0; height:8px; display:flex; z-index:3; }
  .rule span { flex:1; }

  .brandrow { position:absolute; top:62px; left:80px; z-index:2;
              display:flex; align-items:center; gap:16px; }
  .tile { width:44px; height:44px; flex:none; }
  /* No wordmark in this row. The heading below is the series name, and a
     wordmark above it would print the name twice; the page's masthead makes
     the same omission for the same reason. */
  .note { font-family:"DejaVu Sans",sans-serif; font-size:15px; font-weight:600;
          letter-spacing:.11em; text-transform:uppercase; color:#5a5a5a; }

  h1 { position:absolute; top:132px; left:80px; z-index:2;
       font-size:94px; line-height:1.0; letter-spacing:-.022em; font-weight:400; }

  .tagline { position:absolute; top:264px; left:80px; z-index:2;
             font-size:28px; line-height:1.5; color:#3a3a3a; width:690px; }
  .tagline i { color:#0b6e4f; }

  .chips { position:absolute; left:80px; top:468px; z-index:2; display:flex; gap:12px; }
  /* One chip per hue, in the mark's own three, in the mark's own order. */
  .chip { font-family:"DejaVu Sans",sans-serif; font-size:16px; font-weight:600;
          line-height:1; white-space:nowrap; border-radius:999px; padding:13px 21px; }
  .c1 { color:#0b6e4f; background:rgba(11,110,79,.075);  border:1px solid rgba(11,110,79,.28); }
  .c2 { color:#12648d; background:rgba(18,100,141,.075); border:1px solid rgba(18,100,141,.28); }
  .c3 { color:#83456a; background:rgba(131,69,106,.075); border:1px solid rgba(131,69,106,.28); }

  /* Clear of the chip row below it and of the tagline's measure to its
     left, so nothing on the card overlaps anything else. */
  .art { position:absolute; right:78px; top:130px; z-index:1; }
</style></head>
<body>
  <div class="rule">
    <span style="background:#0b6e4f"></span>
    <span style="background:#016a70"></span>
    <span style="background:#12648d"></span>
    <span style="background:#4b5894"></span>
    <span style="background:#6d4d87"></span>
    <span style="background:#83456a"></span>
    <span style="background:#8c4445"></span>
    <span style="background:#864d1e"></span>
    <span style="background:#4c6726"></span>
  </div>

  <!-- The mark at the front of a stack: two empty tiles behind it, which say
       there is more than one of these without naming a number. -->
  <svg class="art" width="308" height="308" viewBox="0 0 308 308" fill="none">
    <rect x="48" y="48" width="260" height="260" rx="57" fill="#fdfdfb" stroke="#c4cac2" stroke-width="2" opacity=".45"/>
    <rect x="24" y="24" width="260" height="260" rx="57" fill="#fdfdfb" stroke="#c4cac2" stroke-width="2" opacity=".8"/>
    <clipPath id="mark"><rect x="0" y="0" width="260" height="260" rx="57"/></clipPath>
    <g clip-path="url(#mark)">
      <rect x="0"   y="0" width="89" height="260" fill="#0b6e4f"/>
      <rect x="89"  y="0" width="89" height="260" fill="#12648d"/>
      <rect x="178" y="0" width="82" height="260" fill="#83456a"/>
    </g>
  </svg>

  <div class="brandrow">
    <svg class="tile" viewBox="0 0 32 32">
      <clipPath id="c"><rect width="32" height="32" rx="7"/></clipPath>
      <g clip-path="url(#c)">
        <rect width="11" height="32" x="0"  fill="#0b6e4f"/>
        <rect width="11" height="32" x="11" fill="#12648d"/>
        <rect width="10" height="32" x="22" fill="#83456a"/>
      </g>
    </svg>
    <span class="note">build-it-yourself courses</span>
  </div>

  <h1>Moving&nbsp;Parts</h1>

  <p class="tagline">
    Courses you finish by <i>building the thing</i><br>
    they are about. Read a little, play with live<br>
    figures, and write the real code in the page.
  </p>

  <div class="chips">
    <span class="chip c1">Real code, really running</span>
    <span class="chip c2">No installs, no accounts</span>
    <span class="chip c3">Nothing is locked</span>
  </div>
</body>
</html>
