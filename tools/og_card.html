<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			/* The series social card, 1200x630, screenshotted to site/og-image.png by
     tools/make_og_image.sh.

     A rendered page rather than a drawn image, for the same reason the rest of
     the identity is tokens: the card is made of the family, the mark and the
     type roles, so a change to those reaches it. tools/check_brand.py asserts
     that the mark here is still the page's three hues in the page's order.

      It is type and one rule, and nothing else. Every claim on it is already
      made by the page in prose, and there is no number that could go stale. An
     earlier version of this card had three colour-coded pills, an accent-
     coloured phrase in the middle of the tagline, and the mark blown up to
     280px with two empty tiles fanned behind it to suggest more were coming.
     Every one of those was the card arguing rather than saying, which for a
     series with one course in it is the least credible thing it could do.

     DejaVu leads both stacks because this renders in a headless Chromium on
     Linux, which has no Georgia. Every colour is a literal, the greys
     included, because nothing in the page's stylesheet reaches a file that is
    rendered for deployment; the nine hues and the mark are the ones
     check_brand.py compares. */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				background: #fdfdfb;
				color: #1a1a1a;
				font-family: "DejaVu Serif", Georgia, serif;
				position: relative;
			}

			/* The whole family across the top, as on the page, and the only colour on
     the card: the family IS the series identity, and unlike a single hue it
     does not borrow any one course's. Nine flex children so it grows a
     segment when the family does. */
			.rule {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 8px;
				display: flex;
			}
			.rule span {
				flex: 1;
			}

			/* The series mark and name are one horizontal lockup at display size. */
			.brandlockup {
				position: absolute;
				top: 145px;
				left: 110px;
				display: flex;
				align-items: center;
				gap: 24px;
			}
			.tile {
				width: 72px;
				height: 72px;
				flex: none;
			}
			h1 {
				font-size: 112px;
				line-height: 1;
				letter-spacing: -0.026em;
				font-weight: 400;
			}
			.note {
				position: absolute;
				top: 285px;
				left: 113px;
				font-family: "DejaVu Sans", sans-serif;
				font-size: 15px;
				font-weight: 600;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: #5a5a5a;
			}

			/* The sentence makes the same claim as the page. Its line break is explicit
	 so the copy keeps the same quiet two-line composition at this size. */
			.sub {
				position: absolute;
				top: 350px;
				left: 113px;
				font-size: 31px;
				line-height: 1.45;
				color: #3a3a3a;
				width: 980px;
			}
		</style>
	</head>
	<body>
		<div class="rule">
			<span style="background: #0b6e4f"></span>
			<span style="background: #016a70"></span>
			<span style="background: #12648d"></span>
			<span style="background: #4b5894"></span>
			<span style="background: #6d4d87"></span>
			<span style="background: #83456a"></span>
			<span style="background: #8c4445"></span>
			<span style="background: #864d1e"></span>
			<span style="background: #4c6726"></span>
		</div>

		<div class="brandlockup">
			<svg class="tile" viewBox="0 0 32 32">
				<clipPath id="c"><rect width="32" height="32" rx="7" /></clipPath>
				<g clip-path="url(#c)">
					<rect width="11" height="32" x="0" fill="#0b6e4f" />
					<rect width="11" height="32" x="11" fill="#12648d" />
					<rect width="10" height="32" x="22" fill="#83456a" />
				</g>
			</svg>
			<h1>Moving&nbsp;Parts</h1>
		</div>

		<p class="note">build-it-yourself courses</p>

		<p class="sub">
			Understand complicated technical systems<br />
			by rebuilding their essential machinery.
		</p>
	</body>
</html>
